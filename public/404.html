<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#08080a" />
    <title>404 — Sayfa Bulunamadı | Samet Kaşmer</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #08080a;
        color: #f3f1ec;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
      }
      main {
        max-width: 480px;
        width: 100%;
        border: 1px solid #232328;
        background: #101013;
        border-radius: 20px;
        padding: 36px 32px;
        text-align: center;
      }
      .code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        letter-spacing: 0.14em;
        color: #d6ff3f;
      }
      h1 {
        margin-top: 12px;
        font-size: 32px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin-top: 12px;
        font-size: 15px;
        line-height: 1.6;
        color: #9a9aa2;
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 24px;
        padding: 11px 22px;
        border-radius: 999px;
        background: #f3f1ec;
        color: #08080a;
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
        transition: opacity 0.2s ease;
      }
      a:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <main>
      <div class="code">ERROR // 404</div>
      <h1>Sayfa bulunamadı</h1>
      <p>Aradığın adres taşınmış veya kaldırılmış olabilir. Ana sayfaya dönüp devam edebilirsin.</p>
      <a href="/">Ana sayfaya dön</a>
    </main>
  </body>
</html>
